<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Repertory — Account</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f8;color:#193149;font:16px/1.6 system-ui}main{max-width:720px;margin:7vh auto;padding:32px;background:#ffffffe8;border:1px solid #cbd9e6;border-radius:24px}h1{line-height:1.2}label{display:block;margin:15px 0}input{display:block;width:100%;padding:12px;border-radius:10px;border:1px solid #b9cada;font:inherit}button,a{font:inherit;margin:6px;padding:10px 16px;border:1px solid #b9cada;border-radius:12px;background:#fff;color:#193149}button:focus-visible,a:focus-visible{outline:3px solid #256ac4}button:disabled{opacity:.5}li{padding:18px 0;border-bottom:1px solid #ccd9e4}#message{white-space:pre-wrap} [hidden]{display:none!important}
</style><script src="/account.js" defer></script></head><body><main><h1>Open Repertory</h1><p id="message" role="status">Checking your session…</p><form id="login" hidden><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="12" maxlength="256" required></label><button id="signin">Sign in</button><button id="signup" type="button">Create account</button></form><div id="session" hidden><a id="workspace" href="/workspace/" hidden>Open clinical workspace →</a><button id="logout">Sign out</button></div><section id="owner" hidden><h2>Account requests</h2><button id="refresh">Refresh requests</button><ul id="accounts"></ul></section></main></body></html>
