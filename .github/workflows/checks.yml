name: Website source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify standalone authorization and sessions
        run: node tests/test_standalone.mjs
      - name: Verify initials-only case policy
        run: |
          node tests/test_case_policy.mjs
          node tests/test_bootstrap.mjs
          node --check standalone/web-motion.js
          node --check standalone/initials-workspace.js
          node --check standalone/clinical-assets.mjs
      - name: Verify website build safeguards
        run: python3 tests/test_website_build.py
      - name: Check design JavaScript syntax
        run: node --check designs/app.js
      - name: Check design interactions
        run: node tests/test_website_samples.js

      - name: Check compressed clinical fetch behavior
        run: node tests/test_data_fetch.js

      - name: Check website refinements
        run: python3 tests/test_web_refinements.py
