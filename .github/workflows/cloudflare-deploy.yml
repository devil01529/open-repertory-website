name: Deploy Similora to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cloudflare/**', 'standalone/**', 'website/**', '.github/workflows/cloudflare-deploy.yml']
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix cloudflare
      - name: Test source and prepare verified clinical bundle
        run: |
          node --check cloudflare/worker.mjs
          node tests/test_cloudflare_worker.mjs
          node tests/test_case_policy.mjs
          node tests/test_standalone.mjs
          node tests/test_migration_export.mjs
          node tests/test_account_relay.mjs
          python3 cloudflare/prepare_baseline.py
          node cloudflare/build_assets.mjs
      - name: Provision and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 cloudflare/provision.py
          cloudflare/node_modules/.bin/wrangler d1 execute similora-accounts --remote --config cloudflare/wrangler.generated.json --file cloudflare/schema.sql
          cloudflare/node_modules/.bin/wrangler deploy --config cloudflare/wrangler.generated.json
      - name: Verify public endpoint responds
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,time
          info=json.load(open('cloudflare/.build/deployment.json'))
          for attempt in range(24):
              try:
                  try:
                      with urllib.request.urlopen(urllib.request.Request(info['url']+'/healthz',headers={'User-Agent':'Similora-Deployment-Check/1.0'}),timeout=20) as res: data=json.load(res)
                  except urllib.error.HTTPError as error:
                      if error.code!=503: raise
                      data=json.load(error)
                  assert data['service'] in ['ready','awaiting account migration']
                  print(info['url'],data['service'])
                  break
              except (urllib.error.URLError,ValueError,AssertionError):
                  if attempt==23: raise
                  print('Waiting for the new HTTPS endpoint to become ready...')
                  time.sleep(10)
          PY
